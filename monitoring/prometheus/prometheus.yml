global:
  scrape_interval: 10s

scrape_configs:
  # Infra conteneurs (CPU/mémoire par service) — remplace node-exporter,
  # explicitement écarté du périmètre : ce TP tourne sur une seule machine.
  - job_name: docker-stats-exporter
    static_configs:
      - targets: ["docker-stats-exporter:8000"]

  # PostgreSQL (tables TP1 + flux temps réel TP2)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Pipeline applicatif — chaque étape expose ses propres métriques métier
  - job_name: api-producer
    static_configs:
      - targets: ["api-producer:8000"]

  - job_name: spark
    static_configs:
      - targets: ["spark:8000"]
