services:
  db:
    image: postgres:16
    container_name: tp_audit_44_pg
    environment:
      POSTGRES_DB: audit_immo_energie_44
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Scripts exécutés automatiquement, dans l'ordre, au premier démarrage
      # (dossier vide -> postgres lance tout *.sql trouvé ici une seule fois).
      - ./sql/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ./sql/03_import_donnees_reelles.sql:/docker-entrypoint-initdb.d/02_import_donnees_reelles.sql:ro
      - ./sql/06_create_flux_table.sql:/docker-entrypoint-initdb.d/03_create_flux_table.sql:ro
      # Monté au même chemin relatif que celui utilisé par le script d'import
      # (data/staging/...), pour qu'il fonctionne sans modification.
      - ./data/staging:/data/staging:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audit_immo_energie_44"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tp2]

  # --- Data Lake ---
  # MinIO nécessite désormais un compte (images Docker Hub / quay.io fermées derrière
  # une authentification depuis fin 2024) : incompatible avec un `docker compose up`
  # reproductible sans intervention. Data Lake = volume Docker partagé, organisé en
  # raw/api, raw/source2, aggregated (exactement l'arborescence donnée par l'énoncé).
  datalake-init:
    image: busybox:latest
    container_name: tp2_datalake_init
    command: sh -c "mkdir -p /datalake/raw/api /datalake/raw/source2 /datalake/aggregated && chmod -R 777 /datalake && echo 'datalake prêt'"
    volumes:
      - datalake_data:/datalake
    networks: [tp2]

  # --- Streaming ---
  kafka:
    image: apache/kafka:3.8.0
    container_name: tp2_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "tp2-kraft-cluster-1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [tp2]

  # --- Pipeline ---
  source2-loader:
    build: ./source2
    container_name: tp2_source2_loader
    depends_on:
      datalake-init:
        condition: service_completed_successfully
    volumes:
      - ./data/staging:/data/staging:ro
      - datalake_data:/datalake
    networks: [tp2]

  api-producer:
    build: ./api
    container_name: tp2_api_producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      BACKFILL_RATE_PER_SEC: "200"
      POLL_INTERVAL_SECONDS: "300"
    ports:
      - "8001:8000"   # métriques Prometheus
    volumes:
      - ./data/staging:/data/staging:ro
      - producer_state:/state
    networks: [tp2]

  aggregator:
    build: ./aggregation
    container_name: tp2_aggregator
    depends_on:
      kafka:
        condition: service_healthy
      source2-loader:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    ports:
      - "8002:8000"   # métriques Prometheus
    volumes:
      - datalake_data:/datalake
    networks: [tp2]

  # PostgreSQL n'exécute les scripts de docker-entrypoint-initdb.d/ (dont
  # sql/06_create_flux_table.sql) qu'à la toute première initialisation d'un
  # volume vide. Sur un volume déjà initialisé par le TP1 (avant l'existence
  # du TP2), ce script ne serait jamais rejoué et diagnostic_dpe_flux
  # n'existerait pas — silencieusement, sans erreur visible pour qui lance
  # juste `docker compose up -d`. CREATE TABLE IF NOT EXISTS le garantit
  # présent dans tous les cas, indépendamment de l'état du volume.
  flux-table-init:
    image: postgres:16
    container_name: tp2_flux_table_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./sql/06_create_flux_table.sql:/flux_table.sql:ro
    # Retry : le healthcheck de `db` peut se déclarer "healthy" juste avant le
    # redémarrage interne que Postgres effectue après son tout premier initdb,
    # ce qui refuse la connexion un court instant malgré `service_healthy`.
    command: >
      sh -c "until psql -h db -U postgres -d audit_immo_energie_44 -f /flux_table.sql; do
      echo 'en attente de PostgreSQL...'; sleep 2; done"
    networks: [tp2]

  spark:
    build: ./spark
    container_name: tp2_spark
    depends_on:
      flux-table-init:
        condition: service_completed_successfully
      aggregator:
        condition: service_started
    environment:
      PG_HOST: db
      SPARK_INTERVAL_SECONDS: "60"
    ports:
      - "8003:8000"   # métriques Prometheus
    volumes:
      - datalake_data:/datalake
    networks: [tp2]

  # --- Observabilité ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: tp2_postgres_exporter
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@db:5432/audit_immo_energie_44?sslmode=disable"
    ports:
      - "9187:9187"
    networks: [tp2]

  # Métriques infra par conteneur (CPU/mémoire/réseau). Remplace node-exporter
  # (écarté du périmètre : ce TP tourne sur une seule machine, pas un cluster
  # à superviser au niveau host).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: tp2_cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks: [tp2]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tp2_prometheus
    depends_on:
      - postgres-exporter
      - cadvisor
      - api-producer
      - aggregator
      - spark
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [tp2]

  # Sert à la fois l'observabilité (Prometheus) et la dataviz métier (PostgreSQL) :
  # le sujet ne demande pas d'outil de dataviz nommé, seulement "un dashboard" —
  # ajouter un second outil (Metabase) uniquement pour ça aurait dupliqué un
  # besoin déjà couvert, sans rien automatiser de plus (son dashboard business se
  # construit à la main dans son UI, contrairement à Grafana qui se provisionne
  # entièrement comme du code, sans étape manuelle).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: tp2_grafana
    depends_on:
      - prometheus
      - db
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [tp2]

networks:
  tp2:

volumes:
  pg_data:
  datalake_data:
  kafka_data:
  producer_state:
  prometheus_data:
  grafana_data:
