<script>
(function () {
  var toc = document.getElementById('TOC');
  if (!toc) return;

  // Wrap the pandoc-generated #TOC in a hover-reveal breadcrumb widget.
  var wrapper = document.createElement('div');
  wrapper.id = 'nav-fil-ariane';
  var label = document.createElement('div');
  label.id = 'breadcrumb-label';
  label.innerHTML = '<span class="crumb-current">…</span>';

  toc.parentNode.insertBefore(wrapper, toc);
  wrapper.appendChild(label);
  wrapper.appendChild(toc);

  // Touch/click fallback: toggle open state (hover alone doesn't exist on touch).
  label.addEventListener('click', function (e) {
    e.stopPropagation();
    wrapper.classList.toggle('is-open');
  });
  document.addEventListener('click', function (e) {
    if (!wrapper.contains(e.target)) wrapper.classList.remove('is-open');
  });

  var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
  if (!links.length) return;
  var map = {};
  links.forEach(function (a) {
    var id = decodeURIComponent(a.getAttribute('href').slice(1));
    var el = document.getElementById(id);
    if (el) map[id] = a;
  });
  var sections = Object.keys(map).map(function (id) { return document.getElementById(id); });
  if (!sections.length) return;

  function setActive(id) {
    links.forEach(function (a) { a.classList.remove('active'); });
    var a = map[id];
    if (!a) return;
    a.classList.add('active');
    label.innerHTML = '<span class="crumb-current">' + a.textContent.trim() + '</span>';
  }

  var observer = new IntersectionObserver(function (entries) {
    var visible = entries.filter(function (e) { return e.isIntersecting; });
    if (visible.length) {
      visible.sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
      setActive(visible[0].target.id);
    }
  }, { rootMargin: '0px 0px -70% 0px', threshold: 0 });

  sections.forEach(function (el) { observer.observe(el); });
  setActive(sections[0].id);
})();
</script>
